services:
  db:
    image: mysql:8.4
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      # Read by db/panel-db.sh when it creates the panel's MySQL user.
      - PANEL_DB_PASSWORD=${PANEL_DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql #soldaki benim diski:sağdaki konternerin içi
      # Files in /docker-entrypoint-initdb.d run in name order, once, when the
      # volume is empty: the events table first, then the panel's database
      # and user. An existing volume ignores them (see docs/COMMANDS.md).
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/panel-db.sh:/docker-entrypoint-initdb.d/02-panel-db.sh:ro

  # The single front door: http://localhost. Routes /market, /api and /admin
  # to the right program (see proxy/Caddyfile).
  proxy:
    image: caddy:2.11.4-alpine
    ports:
      - "80:80"
    volumes:
      # The folder, not the single file: editors save by replacing the file,
      # and a single-file mount would keep pointing at the old copy.
      - ./proxy:/etc/caddy:ro
      - ./market:/srv/market:ro
    # Lets the container reach the Go API and Laravel, which run on this
    # machine rather than in containers, as host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  mysql_data:
